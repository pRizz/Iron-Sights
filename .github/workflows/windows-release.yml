name: Windows builds and provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Compile every source file without the compiler object cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  SDL2_VERSION: 2.30.11
  SDL2_SHA256: 0590db0a47b564aab92499ed03eaa75db9aee17c371080caa3b05df9d49d9ff9

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve authenticated test dependencies
        id: deps
        timeout-minutes: 5
        run: python3 scripts/port/ci_dependencies.py prepare --profile tests --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-deps
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
          restore-keys: ${{ steps.deps.outputs.cache_prefix }}
      - name: Verify cached archives and install test compiler
        timeout-minutes: 10
        env:
          MIDAS_DEPENDENCY_CACHE_HIT: ${{ steps.restore-deps.outputs.cache-hit }}
        run: python3 scripts/port/ci_dependencies.py install --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore-deps.outputs.cache-hit != 'true' && steps.deps.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
      - name: Test gameplay, cache and release tooling without a ROM
        run: |
          bash scripts/port/test_ads.sh
          bash scripts/port/test_upstream_merge.sh
          python3 scripts/port/test_native_tool_launchers.py
          bash scripts/port/test_hud.sh
          bash scripts/port/test_wardrobe.sh
          bash scripts/port/test_mission_cheats.sh
          bash scripts/port/test_mission_times.sh
          bash scripts/port/test_states.sh
          python3 scripts/port/test_distribution.py
          python3 scripts/port/test_sentry_tools.py
          python3 scripts/port/test_ci_dependencies.py
          python3 scripts/port/test_enhanced_fonts.py
          python3 scripts/port/test_hand_gallery.py
          python3 scripts/port/hand_gallery.py verify

  sentry-sdk:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pinned MSVC x86 Sentry runtime
        run: python scripts/port/sentry_tools.py build --work build/sentry-sdk --output build/sentry-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-msvc-x86
          path: build/sentry-runtime
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: [tests, sentry-sdk]
    # Publishing is restricted to main; compilation itself needs no ROM or secrets.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sentry-msvc-x86
          path: build/sentry-runtime
      - name: Resolve authenticated Windows dependencies
        # The reporter is built separately; game compilation stays on GCC x86.
        id: deps
        timeout-minutes: 5
        run: python3 scripts/port/ci_dependencies.py prepare --profile windows --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-deps
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
          restore-keys: ${{ steps.deps.outputs.cache_prefix }}
      - name: Verify cached archives and install Win32 cross compiler
        id: toolchain
        timeout-minutes: 10
        env:
          MIDAS_DEPENDENCY_CACHE_HIT: ${{ steps.restore-deps.outputs.cache-hit }}
        run: python3 scripts/port/ci_dependencies.py install --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-deps.outputs.cache-hit != 'true' && steps.deps.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-sdl
        with:
          path: third_party/sdl2.tar.gz
          key: sdl2-mingw-${{ env.SDL2_VERSION }}-${{ env.SDL2_SHA256 }}
      - name: Fetch or verify checksum-pinned SDL input
        run: |
          set -euo pipefail
          mkdir -p third_party
          if ! test -f third_party/sdl2.tar.gz || ! echo "$SDL2_SHA256  third_party/sdl2.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz" --output third_party/sdl2.tar.gz
          fi
          echo "$SDL2_SHA256  third_party/sdl2.tar.gz" | sha256sum -c -
          tar -xzf third_party/sdl2.tar.gz -C third_party
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-sdl.outputs.cache-hit != 'true'
        with:
          path: third_party/sdl2.tar.gz
          key: sdl2-mingw-${{ env.SDL2_VERSION }}-${{ env.SDL2_SHA256 }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-ccache
          key: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-
      - name: Choose build identity
        run: |
          echo "MIDAS_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "MIDAS_RELEASE_TAG=build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Compile exact checked-out commit
        env:
          CCACHE_DIR: ${{ runner.temp }}/midas-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 256M
          CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          if [ "$CLEAN_BUILD" = true ]; then export CCACHE_DISABLE=1; fi
          ccache --zero-stats
          cmake -B build_win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Debug -DGE_VIDEO=ON -DGE_ROMDATA_FALLBACK=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DMIDAS_SENTRY_INCLUDE_DIR="$PWD/build/sentry-runtime/include"
          cmake --build build_win --parallel "$(nproc)"
          ccache --show-stats | tee build_win/ccache-stats.txt
          cat build_win/ccache-stats.txt >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code HEAD
          python3 -c "import json; m=json.load(open('build_win/generated/build-info.json')); assert m['ci'] and not m['dirty']"
      - name: Upload exact Windows debug information and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 scripts/port/sentry_tools.py upload --exe build_win/IronSights.exe --sdk build/sentry-runtime --work build/sentry-cli
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-ccache
          key: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package only player files
        env:
          MIDAS_DEPENDENCIES_FILE: ${{ runner.temp }}/midas-deps/verified-inputs.json
          MIDAS_CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          python3 scripts/port/sentry_tools.py stage --source build/sentry-runtime --destination build_win
          python3 scripts/port/package_windows.py --build build_win --output dist --sdl-license third_party/SDL2-${SDL2_VERSION}/LICENSE.txt
          python3 scripts/port/release_inputs.py --output dist/build-inputs.json
          cp build_win/IronSights.exe dist/IronSights.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-player-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned Linux baseline image
        run: docker build -t midas-linux-release -f scripts/port/linux-release.Dockerfile .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-linux-ccache
          key: linux-ccache-${{ hashFiles('scripts/port/linux-release.Dockerfile', 'scripts/port/linux_build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-ccache-${{ hashFiles('scripts/port/linux-release.Dockerfile', 'scripts/port/linux_build.py') }}-
      - name: Compile optimized i686 game and pinned reporter without a ROM
        env:
          CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/midas-linux-ccache"
          export MIDAS_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export MIDAS_RELEASE_TAG="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/midas-linux-ccache:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/src -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=256M -e MIDAS_CLEAN_BUILD="$CLEAN_BUILD" -e GITHUB_ACTIONS -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e MIDAS_BUILD_TIME_UTC -e MIDAS_RELEASE_TAG midas-linux-release python3 scripts/port/linux_build.py --work /src/build_linux_ci/deps --output /src/build_linux_ci
          git diff --exit-code HEAD
          python3 -c "import json; m=json.load(open('build_linux_ci/generated/build-info.json')); assert m['ci'] and not m['dirty']"
      - name: Upload exact Linux debug information and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm -v "$PWD:/src" -e SENTRY_AUTH_TOKEN midas-linux-release python3 scripts/port/sentry_tools.py upload --exe build_linux_ci/symbols/IronSights.debug --sdk build_linux_ci/symbols --work build_linux_ci/sentry-cli
      - name: Package tarball and AppImage and test real crashes
        run: |
          docker run --rm -v "$PWD:/src" midas-linux-release python3 scripts/port/package_linux.py --build build_linux_ci --output build_linux_ci/dist
          docker run --rm -v "$PWD:/src" midas-linux-release python3 scripts/port/test_sentry_linux.py --package build_linux_ci/dist/Iron-Sights-linux-i686.tar.gz --appimage build_linux_ci/dist/Iron-Sights-linux-i686.AppImage --output build_linux_ci/smoke
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-linux-ccache
          key: linux-ccache-${{ hashFiles('scripts/port/linux-release.Dockerfile', 'scripts/port/linux_build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-player-package
          path: |
            build_linux_ci/dist/*.tar.gz
            build_linux_ci/dist/*.AppImage
            build_linux_ci/dist/SHA256SUMS-linux.txt
            build_linux_ci/dist/linux-build-*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-smoke-diagnostics
          path: build_linux_ci/smoke
          if-no-files-found: ignore
          retention-days: 7

  sentry-smoke:
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-player-package
          path: build/player-package
      - name: Test packaged reporting, opt-out and crash capture without a ROM
        run: python scripts/port/test_sentry_windows.py --package build/player-package/Iron-Sights-windows-x86.zip --output build/sentry-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sentry-smoke-diagnostics
          path: build/sentry-smoke
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [windows, sentry-smoke, linux]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-player-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-player-package
          path: dist
      - name: Attest native player packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/IronSights.exe
            dist/Iron-Sights-windows-x86.zip
            dist/Iron-Sights-linux-i686.tar.gz
            dist/Iron-Sights-linux-i686.AppImage
      - name: Preserve provenance and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/build-provenance.sigstore.json
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('dist/build-info.json').read_text())
          assert m['commit']==os.environ['GITHUB_SHA'] and m['ci'] and not m['dirty']
          linux=json.loads(Path('dist/linux-build-info.json').read_text())
          assert linux['commit']==m['commit'] and linux['ci'] and not linux['dirty']
          text=f'''Download **Iron-Sights-windows-x86.zip**, extract the entire ZIP, put your own stock USA ROM in its Data folder, then run IronSights.exe.

          Linux: download **Iron-Sights-linux-i686.tar.gz** or **Iron-Sights-linux-i686.AppImage**. Both require a 32-bit-capable x86 Linux with glibc 2.35+ and 32-bit OpenGL drivers. AppImage data lives in `~/.local/share/iron-sights` (or XDG_DATA_HOME); the tarball keeps data beside the executable. See START-HERE.txt.

          This is a continuously published development build. Weapon icons are prepared locally on first launch; no Python or asset downloads are required.

          - Source: [{m['commit']}]({m['source_url']})
          - Built at: {m['built_at']}
          - GitHub Actions: [build run]({m['workflow_url']})
          - Signed provenance: [attestation]({os.environ['ATTESTATION_URL']})

          Verify with `gh attestation verify Iron-Sights-windows-x86.zip -R {m['repository']}`. Build metadata, input fingerprints, checksums and the provenance bundle are preserved below. The ROM is not included.

          Preserve Data and midas.ini when updating. Suspend points require their original executable; campaign saves are separate.

          Windows and Linux crash reporting is ON by default. Turn it off in Port Options > Crash Reporting or set `[diagnostics] crash_reporting=0` in midas.ini. Reports contain technical diagnostics; no minidumps, ROMs or saves are attached. See scripts/port/crash_reporting.md for payload and privacy details.
          '''
          Path('notes.md').write_text(text)
          PY
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Native build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA:0:9})" --notes-file notes.md dist/Iron-Sights-windows-x86.zip dist/SHA256SUMS.txt dist/build-info.json dist/build-inputs.json dist/build-provenance.sigstore.json dist/Iron-Sights-linux-i686.tar.gz dist/Iron-Sights-linux-i686.AppImage dist/SHA256SUMS-linux.txt dist/linux-build-info.json dist/linux-build-inputs.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "## Native downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
