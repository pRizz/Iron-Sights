name: Windows builds and provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Compile every source file without the compiler object cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  SDL2_VERSION: 2.30.11
  SDL2_SHA256: 0590db0a47b564aab92499ed03eaa75db9aee17c371080caa3b05df9d49d9ff9

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve authenticated test dependencies
        id: deps
        timeout-minutes: 5
        run: python3 scripts/port/ci_dependencies.py prepare --profile tests --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-deps
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
          restore-keys: ${{ steps.deps.outputs.cache_prefix }}
      - name: Verify cached archives and install test compiler
        timeout-minutes: 10
        env:
          MIDAS_DEPENDENCY_CACHE_HIT: ${{ steps.restore-deps.outputs.cache-hit }}
        run: python3 scripts/port/ci_dependencies.py install --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore-deps.outputs.cache-hit != 'true' && steps.deps.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
      - name: Test gameplay, cache and release tooling without a ROM
        run: |
          bash scripts/port/test_ads.sh
          MIDAS_BUFFER_SANITIZE=1 bash scripts/port/test_buffers.sh
          bash scripts/port/test_build_time.sh
          bash scripts/port/test_build_arch.sh
          MIDAS_SAVE_TEST_I686=1 bash scripts/port/test_save_transfer.sh
          bash scripts/port/test_upstream_merge.sh
          python3 scripts/port/test_native_tool_launchers.py
          bash scripts/port/test_hud.sh
          bash scripts/port/test_roomcache_key.sh
          bash scripts/port/test_open_fonts.sh
          bash scripts/port/test_enhanced_fonts.sh
          bash scripts/port/test_hd_textures.sh
          bash scripts/port/test_hit_sound.sh
          python3 scripts/port/test_hit_sound_capture.py
          python3 scripts/port/test_settings_placement.py
          python3 scripts/port/settings_placement.py
          bash scripts/port/test_mission_hints.sh
          bash scripts/port/test_wardrobe.sh
          bash scripts/port/test_mission_cheats.sh
          bash scripts/port/test_mission_times.sh
          bash scripts/port/test_states.sh
          bash scripts/port/test_baked_trace.sh
          bash scripts/port/test_room_seams.sh
          bash scripts/port/test_hitmap.sh
          bash scripts/port/test_image_bank.sh
          bash scripts/port/test_stan_callbacks.sh
          bash scripts/port/test_start_input.sh
          bash scripts/port/test_xwayland_pointer.sh
          bash scripts/port/test_posix_dialog.sh
          bash scripts/port/test_web_logo.sh
          python3 scripts/port/test_distribution.py
          python3 scripts/port/test_open_assets.py
          python3 scripts/port/test_linux_launcher.py
          python3 scripts/port/test_steam_art.py
          python3 scripts/port/test_sentry_tools.py
          python3 scripts/port/test_download_retry.py
          python3 scripts/port/test_bench.py
          python3 scripts/port/test_ci_dependencies.py
          python3 scripts/port/test_hand_gallery.py
          python3 scripts/port/test_lp64_env.py
          python3 scripts/port/test_linux_build.py
          bash scripts/port/test_harness_widths.sh
          bash scripts/port/test_abi_probe.sh
          bash scripts/port/test_lp64_typed_reads.sh
          bash scripts/port/test_lp64_address.sh
          bash scripts/port/test_lp64_notice.sh
          python3 scripts/port/test_lp64_boot.py
          python3 scripts/port/test_lp64_play.py
          python3 scripts/port/test_lp64_play_video.py
          python3 scripts/port/test_lp64_play_options.py
          python3 scripts/port/test_lp64_play_traces.py
          python3 scripts/port/test_lp64_play_input.py
          python3 scripts/port/test_lp64_play_sound.py
          python3 scripts/port/test_lp64_play_peaks.py
          python3 scripts/port/test_lp64_budgets.py
          python3 scripts/port/test_run_copies.py
          bash scripts/port/test_inputrec_headless.sh
          bash scripts/port/test_lp64_compare.sh
          bash scripts/port/test_save_widths.sh
          bash scripts/port/test_gfx_digest.sh
          bash scripts/port/test_image_inflate.sh
          bash scripts/port/test_startup_stamp.sh
          python3 scripts/port/test_lp64_equiv_streams.py
          python3 scripts/port/test_lp64_equiv.py
          python3 scripts/port/test_lp64_equiv_video.py
          python3 scripts/port/test_lp64_equiv_cases.py
          python3 scripts/port/test_lp64_equiv_expect.py
          python3 scripts/port/test_lp64_equiv_compare.py
          python3 scripts/port/test_lp64_equiv_pictures.py
          bash scripts/port/test_audio_synth.sh
          bash scripts/port/test_romconv.sh
          python3 scripts/port/test_lp64_oracle.py
          python3 scripts/port/test_lp64_census.py
          python3 scripts/port/test_late_load_audit.py
          bash scripts/port/test_monitor_script.sh
          bash scripts/port/test_mema_order.sh
          python3 scripts/port/test_lp64_diagnostics.py
          python3 scripts/port/test_lp64_static_checks.py
          python3 scripts/port/test_lp64_lto.py
          python3 scripts/port/test_lp64_casts.py
          python3 scripts/port/lp64_casts.py check
          python3 scripts/port/test_lp64_overlays.py
          python3 scripts/port/test_lp64_overlays_check.py
          python3 scripts/port/lp64_overlays.py check --no-defects
          python3 scripts/port/test_lp64_model_scan.py
          python3 scripts/port/test_lp64_setup_scan.py
          python3 scripts/port/test_lp64_pointer_types.py
          python3 scripts/port/test_compare_win32.py
          bash scripts/port/test_pointer_bits.sh
          bash scripts/port/test_headless_configure.sh
          cmake -S . -B build/lp64/diag -DCMAKE_BUILD_TYPE=Debug -DGE_HEADLESS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/lp64/diag -j"$(nproc)"
          cmake -S . -B build/lp64/gate -DCMAKE_BUILD_TYPE=Debug -DGE_POINTER_BITS=64 -DGE_HEADLESS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/lp64/gate --target ge_buildinfo
          cmake -S . -B build/lp64/gate-video -DCMAKE_BUILD_TYPE=Debug -DGE_POINTER_BITS=64 -DGE_VIDEO=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/lp64/gate-video --target ge_buildinfo
          python3 scripts/port/lp64_diagnostics.py gate build/lp64/gate build/lp64/gate-video
          python3 scripts/port/lp64_diagnostics.py narrowing --check build/lp64/gate build/lp64/gate-video
          python3 scripts/port/lp64_diagnostics.py unprototyped --check build/lp64/gate build/lp64/gate-video
          python3 scripts/port/lp64_pointer_types.py check build/lp64/gate build/lp64/gate-video
          cmake -S . -B build/lp64/lto -DCMAKE_BUILD_TYPE=Debug -DGE_POINTER_BITS=64 -DGE_HEADLESS=ON "-DCMAKE_C_FLAGS=-flto=auto -Wlto-type-mismatch" "-DCMAKE_CXX_FLAGS=-flto=auto -Wlto-type-mismatch" "-DCMAKE_EXE_LINKER_FLAGS=-flto=auto -Wlto-type-mismatch" "-DCMAKE_C_LINKER_LAUNCHER=env;-u;MAKEFLAGS" "-DCMAKE_CXX_LINKER_LAUNCHER=env;-u;MAKEFLAGS"
          LC_ALL=C cmake --build build/lp64/lto --target ge -j"$(nproc)" > build/lp64/lto/lto-build.log 2>&1 || { tail -n 60 build/lp64/lto/lto-build.log; exit 1; }
          cmake -S . -B build/lp64/lto-video -DCMAKE_BUILD_TYPE=Debug -DGE_POINTER_BITS=64 -DGE_VIDEO=ON "-DCMAKE_C_FLAGS=-flto=auto -Wlto-type-mismatch" "-DCMAKE_CXX_FLAGS=-flto=auto -Wlto-type-mismatch" "-DCMAKE_EXE_LINKER_FLAGS=-flto=auto -Wlto-type-mismatch" "-DCMAKE_C_LINKER_LAUNCHER=env;-u;MAKEFLAGS" "-DCMAKE_CXX_LINKER_LAUNCHER=env;-u;MAKEFLAGS"
          LC_ALL=C cmake --build build/lp64/lto-video --target ge -j"$(nproc)" > build/lp64/lto-video/lto-build.log 2>&1 || { tail -n 60 build/lp64/lto-video/lto-build.log; exit 1; }
          python3 scripts/port/lp64_lto.py check build/lp64/lto/lto-build.log build/lp64/lto-video/lto-build.log
          python3 scripts/port/hand_gallery.py verify --allow-pending

  # The builds start alongside the tests instead of after them; publish waits
  # for the tests, so a failing test still stops a release.
  sentry-sdk:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Identify the runner image
        # The image fixes the MSVC version the runtime is built with.
        id: image
        shell: bash
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-sentry
        with:
          path: build/sentry-runtime
          key: sentry-msvc-x86-${{ hashFiles('scripts/port/sentry_config.json', 'scripts/port/sentry_tools.py') }}-${{ steps.image.outputs.version }}
      - name: Build pinned MSVC x86 Sentry runtime
        # The pinned commit builds the same runtime on the same image, so a
        # cached copy is reused; `stage` rechecks its hashes before packaging.
        if: steps.restore-sentry.outputs.cache-hit != 'true'
        run: python scripts/port/sentry_tools.py build --work build/sentry-sdk --output build/sentry-runtime
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-sentry.outputs.cache-hit != 'true'
        with:
          path: build/sentry-runtime
          key: sentry-msvc-x86-${{ hashFiles('scripts/port/sentry_config.json', 'scripts/port/sentry_tools.py') }}-${{ steps.image.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-msvc-x86
          path: build/sentry-runtime
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: sentry-sdk
    # Publishing is restricted to main; compilation itself needs no ROM or secrets.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sentry-msvc-x86
          path: build/sentry-runtime
      - name: Resolve authenticated Windows dependencies
        # The reporter is built separately; game compilation stays on GCC x86.
        id: deps
        timeout-minutes: 5
        run: python3 scripts/port/ci_dependencies.py prepare --profile windows --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-deps
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
          restore-keys: ${{ steps.deps.outputs.cache_prefix }}
      - name: Verify cached archives and install Win32 cross compiler
        id: toolchain
        timeout-minutes: 10
        env:
          MIDAS_DEPENDENCY_CACHE_HIT: ${{ steps.restore-deps.outputs.cache-hit }}
        run: python3 scripts/port/ci_dependencies.py install --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-deps.outputs.cache-hit != 'true' && steps.deps.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-sdl
        with:
          path: third_party/sdl2.tar.gz
          key: sdl2-mingw-${{ env.SDL2_VERSION }}-${{ env.SDL2_SHA256 }}
      - name: Fetch or verify checksum-pinned SDL input
        run: |
          set -euo pipefail
          mkdir -p third_party
          if ! test -f third_party/sdl2.tar.gz || ! echo "$SDL2_SHA256  third_party/sdl2.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz" --output third_party/sdl2.tar.gz
          fi
          echo "$SDL2_SHA256  third_party/sdl2.tar.gz" | sha256sum -c -
          tar -xzf third_party/sdl2.tar.gz -C third_party
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-sdl.outputs.cache-hit != 'true'
        with:
          path: third_party/sdl2.tar.gz
          key: sdl2-mingw-${{ env.SDL2_VERSION }}-${{ env.SDL2_SHA256 }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-ccache
          key: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-
      - name: Choose build identity
        run: |
          echo "MIDAS_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "MIDAS_RELEASE_TAG=build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Compile exact checked-out commit
        env:
          CCACHE_DIR: ${{ runner.temp }}/midas-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 256M
          CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          if [ "$CLEAN_BUILD" = true ]; then export CCACHE_DISABLE=1; fi
          ccache --zero-stats
          cmake -B build_win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Debug -DGE_VIDEO=ON -DGE_ROMDATA_FALLBACK=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DMIDAS_SENTRY_INCLUDE_DIR="$PWD/build/sentry-runtime/include"
          cmake --build build_win --parallel "$(nproc)"
          ccache --show-stats | tee build_win/ccache-stats.txt
          cat build_win/ccache-stats.txt >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code HEAD
          python3 -c "import json; m=json.load(open('build_win/generated/build-info.json')); assert m['ci'] and not m['dirty']"
      - name: Upload exact Windows debug information and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 scripts/port/sentry_tools.py upload --exe build_win/IronSights.exe --sdk build/sentry-runtime --work build/sentry-cli
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-ccache
          key: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package only player files
        env:
          MIDAS_DEPENDENCIES_FILE: ${{ runner.temp }}/midas-deps/verified-inputs.json
          MIDAS_CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          python3 scripts/port/sentry_tools.py stage --source build/sentry-runtime --destination build_win
          python3 scripts/port/package_windows.py --build build_win --output dist --sdl-license third_party/SDL2-${SDL2_VERSION}/LICENSE.txt
          python3 scripts/port/release_inputs.py --output dist/build-inputs.json
          cp build_win/IronSights.exe dist/IronSights.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-player-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned Linux baseline image
        run: docker build -t midas-linux-release -f scripts/port/linux-release.Dockerfile .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-linux-ccache
          key: linux-ccache-${{ hashFiles('scripts/port/linux-release.Dockerfile', 'scripts/port/linux_build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-ccache-${{ hashFiles('scripts/port/linux-release.Dockerfile', 'scripts/port/linux_build.py') }}-
      # SHA256-pinned SDL source and AppImage runtime; both are verified again
      # before use, so a cached copy needs no GitHub release download.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-linux-downloads
        with:
          path: |
            build_linux_ci/deps/downloads
            build_linux_ci/downloads
          key: linux-downloads-${{ hashFiles('scripts/port/linux_build.py', 'scripts/port/package_linux.py') }}
      - name: Compile optimized i686 game and pinned reporter without a ROM
        env:
          CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/midas-linux-ccache"
          export MIDAS_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export MIDAS_RELEASE_TAG="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/midas-linux-ccache:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/src -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=256M -e MIDAS_CLEAN_BUILD="$CLEAN_BUILD" -e GITHUB_ACTIONS -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e MIDAS_BUILD_TIME_UTC -e MIDAS_RELEASE_TAG midas-linux-release python3 scripts/port/linux_build.py --work /src/build_linux_ci/deps --output /src/build_linux_ci
          git diff --exit-code HEAD
          python3 -c "import json; m=json.load(open('build_linux_ci/generated/build-info.json')); assert m['ci'] and not m['dirty']"
      - name: Upload exact Linux debug information and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm -v "$PWD:/src" -e SENTRY_AUTH_TOKEN midas-linux-release python3 scripts/port/sentry_tools.py upload --exe build_linux_ci/symbols/IronSights.debug --sdk build_linux_ci/symbols --work build_linux_ci/sentry-cli
      - name: Package Linux and Steam Deck downloads and test real crashes
        run: |
          docker run --rm -v "$PWD:/src" midas-linux-release python3 scripts/port/package_linux.py --build build_linux_ci --output build_linux_ci/dist
          docker run --rm -v "$PWD:/src" midas-linux-release python3 scripts/port/test_sentry_linux.py --package build_linux_ci/dist/Iron-Sights-linux-i686.tar.gz --appimage build_linux_ci/dist/Iron-Sights-linux-i686.AppImage --steamdeck build_linux_ci/dist/Iron-Sights-steamdeck-i686.zip --output build_linux_ci/smoke
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-linux-downloads.outputs.cache-hit != 'true'
        with:
          path: |
            build_linux_ci/deps/downloads
            build_linux_ci/downloads
          key: linux-downloads-${{ hashFiles('scripts/port/linux_build.py', 'scripts/port/package_linux.py') }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-linux-ccache
          key: linux-ccache-${{ hashFiles('scripts/port/linux-release.Dockerfile', 'scripts/port/linux_build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-player-package
          path: |
            build_linux_ci/dist/*.tar.gz
            build_linux_ci/dist/*.AppImage
            build_linux_ci/dist/*.zip
            build_linux_ci/dist/SHA256SUMS-linux.txt
            build_linux_ci/dist/linux-build-*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-smoke-diagnostics
          path: build_linux_ci/smoke
          if-no-files-found: ignore
          retention-days: 7

  # The 64-bit packages are built and tested on every push to main; publish
  # needs this job and attaches its three packages beside the i686 ones.
  linux-x86_64:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned Linux baseline image
        run: docker build -t midas-linux-release-x86_64 -f scripts/port/linux-release-x86_64.Dockerfile .
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-linux-ccache
          key: linux-x86_64-ccache-${{ hashFiles('scripts/port/linux-release-x86_64.Dockerfile', 'scripts/port/linux_build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-x86_64-ccache-${{ hashFiles('scripts/port/linux-release-x86_64.Dockerfile', 'scripts/port/linux_build.py') }}-
      # SHA256-pinned SDL source and AppImage runtime; both are verified again
      # before use, so a cached copy needs no GitHub release download.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-linux-downloads
        with:
          path: |
            build_linux_x86_64_ci/deps/downloads
            build_linux_x86_64_ci/downloads
          key: linux-x86_64-downloads-${{ hashFiles('scripts/port/linux_build.py', 'scripts/port/package_linux.py') }}
      - name: Compile optimized x86_64 game and pinned reporter without a ROM
        env:
          CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/midas-linux-ccache"
          export MIDAS_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export MIDAS_RELEASE_TAG="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/midas-linux-ccache:/ccache" -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/src -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=256M -e MIDAS_CLEAN_BUILD="$CLEAN_BUILD" -e GITHUB_ACTIONS -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e MIDAS_BUILD_TIME_UTC -e MIDAS_RELEASE_TAG midas-linux-release-x86_64 python3 scripts/port/linux_build.py --arch x86_64 --work /src/build_linux_x86_64_ci/deps --output /src/build_linux_x86_64_ci
          git diff --exit-code HEAD
          python3 -c "import json; m=json.load(open('build_linux_x86_64_ci/generated/build-info.json')); assert m['ci'] and not m['dirty']"
      - name: Upload exact Linux debug information and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker run --rm -v "$PWD:/src" -e SENTRY_AUTH_TOKEN midas-linux-release-x86_64 python3 scripts/port/sentry_tools.py upload --exe build_linux_x86_64_ci/symbols/IronSights.debug --sdk build_linux_x86_64_ci/symbols --work build_linux_x86_64_ci/sentry-cli
      - name: Package Linux and Steam Deck downloads and test real crashes
        run: |
          docker run --rm -v "$PWD:/src" midas-linux-release-x86_64 python3 scripts/port/package_linux.py --arch x86_64 --build build_linux_x86_64_ci --output build_linux_x86_64_ci/dist
          docker run --rm -v "$PWD:/src" midas-linux-release-x86_64 python3 scripts/port/test_sentry_linux.py --arch x86_64 --package build_linux_x86_64_ci/dist/Iron-Sights-linux-x86_64.tar.gz --appimage build_linux_x86_64_ci/dist/Iron-Sights-linux-x86_64.AppImage --steamdeck build_linux_x86_64_ci/dist/Iron-Sights-steamdeck-x86_64.zip --output build_linux_x86_64_ci/smoke
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-linux-downloads.outputs.cache-hit != 'true'
        with:
          path: |
            build_linux_x86_64_ci/deps/downloads
            build_linux_x86_64_ci/downloads
          key: linux-x86_64-downloads-${{ hashFiles('scripts/port/linux_build.py', 'scripts/port/package_linux.py') }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-linux-ccache
          key: linux-x86_64-ccache-${{ hashFiles('scripts/port/linux-release-x86_64.Dockerfile', 'scripts/port/linux_build.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-player-package
          path: |
            build_linux_x86_64_ci/dist/*.tar.gz
            build_linux_x86_64_ci/dist/*.AppImage
            build_linux_x86_64_ci/dist/*.zip
            build_linux_x86_64_ci/dist/SHA256SUMS-linux-x86_64.txt
            build_linux_x86_64_ci/dist/linux-x86_64-build-*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-x86_64-smoke-diagnostics
          path: build_linux_x86_64_ci/smoke
          if-no-files-found: ignore
          retention-days: 7

  sentry-smoke:
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-player-package
          path: build/player-package
      - name: Test packaged reporting, opt-out and crash capture without a ROM
        run: python scripts/port/test_sentry_windows.py --package build/player-package/Iron-Sights-windows-x86.zip --output build/sentry-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sentry-smoke-diagnostics
          path: build/sentry-smoke
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [tests, windows, sentry-smoke, linux, linux-x86_64]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-player-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-player-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-x86_64-player-package
          path: dist
      - name: Attest native player packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/IronSights.exe
            dist/Iron-Sights-windows-x86.zip
            dist/Iron-Sights-linux-i686.tar.gz
            dist/Iron-Sights-linux-i686.AppImage
            dist/Iron-Sights-steamdeck-i686.zip
            dist/Iron-Sights-linux-x86_64.tar.gz
            dist/Iron-Sights-linux-x86_64.AppImage
            dist/Iron-Sights-steamdeck-x86_64.zip
      - name: Preserve provenance and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS-linux.txt)
          (cd dist && sha256sum -c SHA256SUMS-linux-x86_64.txt)
          cp "$BUNDLE" dist/build-provenance.sigstore.json
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('dist/build-info.json').read_text())
          assert m['commit']==os.environ['GITHUB_SHA'] and m['ci'] and not m['dirty']
          linux=json.loads(Path('dist/linux-build-info.json').read_text())
          assert linux['commit']==m['commit'] and linux['ci'] and not linux['dirty']
          linux64=json.loads(Path('dist/linux-x86_64-build-info.json').read_text())
          assert linux64['commit']==m['commit'] and linux64['ci'] and not linux64['dirty']
          text=f'''Download **Iron-Sights-windows-x86.zip**, extract the entire ZIP, put your own stock USA ROM in its Data folder, then run IronSights.exe.

          Linux: download **Iron-Sights-linux-i686.tar.gz** or **Iron-Sights-linux-i686.AppImage**. Both require a 32-bit-capable x86 Linux with glibc 2.35+, 32-bit OpenGL drivers and the system's 32-bit C++ runtime (libstdc++ and libgcc_s). AppImage data lives in `~/.local/share/iron-sights` (or XDG_DATA_HOME); the tarball keeps data beside the executable. See START-HERE.txt.

          Steam Deck / SteamOS: **Iron-Sights-steamdeck-i686.zip** repackages the same 32-bit Linux game with a `run.sh` launcher and Deck setup instructions. Extract it in a writable folder, put your own ROM in `Data`, and run `sh run.sh` in Desktop Mode. `set-steam-art.py` gives the Non-Steam Game shortcut its name, icon and library artwork. Device compatibility has not yet been verified on a Steam Deck.

          64-bit Linux: **Iron-Sights-linux-x86_64.tar.gz** and **Iron-Sights-linux-x86_64.AppImage** are a native 64-bit build for x86_64 Linux with glibc 2.35+ and OpenGL 3.3 drivers; no 32-bit libraries are needed, and the C++ runtime comes from your distribution. **Iron-Sights-steamdeck-x86_64.zip** packages the same 64-bit game for the Deck; it has not been run on a Steam Deck. Known issue: under WSL with NVIDIA's driver, quitting the 64-bit game ends in a crash inside the driver (exit status 139). WSL is not a way to play the 64-bit build: mouse-look cannot be played under WSLg, and there the game reaches the graphics card only with `GALLIUM_DRIVER=d3d12` (and, beside an Intel chip, `MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA`); without them it draws with Mesa's software renderer. Suspend points are unavailable in 64-bit builds (campaign saves work), so the i686 downloads remain for suspend points and 32-bit systems. The i686 Linux downloads take the C++ runtime from the system, not from bundled copies (not yet confirmed on a system with Mesa 25). See START-HERE.txt in each package.

          This is a continuously published development build. Weapon icons are prepared locally on first launch; no Python or asset downloads are required.

          - Source: [{m['commit']}]({m['source_url']})
          - Built at: {m['built_at']}
          - GitHub Actions: [build run]({m['workflow_url']})
          - Signed provenance: [attestation]({os.environ['ATTESTATION_URL']})

          Verify with `gh attestation verify Iron-Sights-windows-x86.zip -R {m['repository']}`. Build metadata, input fingerprints, checksums and the provenance bundle are preserved below. The ROM is not included.

          Preserve Data and midas.ini when updating. Suspend points require their original executable; campaign saves are separate.

          Fonts: Gameplay > Iron Sights > System > Fonts chooses Original (the default) or Enhanced; our own Iron Sights font is hidden for now while its deficiencies are fixed. Enhanced is Carnivorous's CC0 redraw from GitHub (Graslu/GEPDTexturePacks), which these downloads do not include: the game fetches its 186 files (250 KB) only when you choose Download on the Enhanced Fonts page or Get Enhanced Fonts in Options, and Remove there deletes them.

          Windows and Linux crash reporting is ON by default. Turn it off in Port Options > Crash Reporting or set `[diagnostics] crash_reporting=0` in midas.ini. Reports contain technical diagnostics; no minidumps, ROMs or saves are attached. See scripts/port/crash_reporting.md for payload and privacy details.
          '''
          Path('notes.md').write_text(text)
          PY
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Native build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA:0:9})" --notes-file notes.md dist/Iron-Sights-windows-x86.zip dist/SHA256SUMS.txt dist/build-info.json dist/build-inputs.json dist/build-provenance.sigstore.json dist/Iron-Sights-linux-i686.tar.gz dist/Iron-Sights-linux-i686.AppImage dist/Iron-Sights-steamdeck-i686.zip dist/SHA256SUMS-linux.txt dist/linux-build-info.json dist/linux-build-inputs.json dist/Iron-Sights-linux-x86_64.tar.gz dist/Iron-Sights-linux-x86_64.AppImage dist/Iron-Sights-steamdeck-x86_64.zip dist/SHA256SUMS-linux-x86_64.txt dist/linux-x86_64-build-info.json dist/linux-x86_64-build-inputs.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "## Native downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
