name: Windows builds and provenance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Compile every source file without the compiler object cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  SDL2_VERSION: 2.30.11
  SDL2_SHA256: 0590db0a47b564aab92499ed03eaa75db9aee17c371080caa3b05df9d49d9ff9

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve authenticated test dependencies
        id: deps
        timeout-minutes: 5
        run: python3 scripts/port/ci_dependencies.py prepare --profile tests --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-deps
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
          restore-keys: ${{ steps.deps.outputs.cache_prefix }}
      - name: Verify cached archives and install test compiler
        timeout-minutes: 10
        env:
          MIDAS_DEPENDENCY_CACHE_HIT: ${{ steps.restore-deps.outputs.cache-hit }}
        run: python3 scripts/port/ci_dependencies.py install --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore-deps.outputs.cache-hit != 'true' && steps.deps.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
      - name: Test gameplay, cache and release tooling without a ROM
        run: |
          bash scripts/port/test_ads.sh
          bash scripts/port/test_hud.sh
          bash scripts/port/test_wardrobe.sh
          bash scripts/port/test_mission_cheats.sh
          bash scripts/port/test_states.sh
          python3 scripts/port/test_distribution.py
          python3 scripts/port/test_ci_dependencies.py
          python3 scripts/port/test_enhanced_fonts.py
          python3 scripts/port/test_hand_gallery.py
          python3 scripts/port/hand_gallery.py verify

  windows:
    needs: tests
    # Publishing is restricted to main; compilation itself needs no ROM or secrets.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve authenticated Windows dependencies
        id: deps
        timeout-minutes: 5
        run: python3 scripts/port/ci_dependencies.py prepare --profile windows --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-deps
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
          restore-keys: ${{ steps.deps.outputs.cache_prefix }}
      - name: Verify cached archives and install Win32 cross compiler
        id: toolchain
        timeout-minutes: 10
        env:
          MIDAS_DEPENDENCY_CACHE_HIT: ${{ steps.restore-deps.outputs.cache-hit }}
        run: python3 scripts/port/ci_dependencies.py install --root "$RUNNER_TEMP/midas-deps"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-deps.outputs.cache-hit != 'true' && steps.deps.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/midas-deps/archives/*.deb
          key: ${{ steps.deps.outputs.cache_key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-sdl
        with:
          path: third_party/sdl2.tar.gz
          key: sdl2-mingw-${{ env.SDL2_VERSION }}-${{ env.SDL2_SHA256 }}
      - name: Fetch or verify checksum-pinned SDL input
        run: |
          set -euo pipefail
          mkdir -p third_party
          if ! test -f third_party/sdl2.tar.gz || ! echo "$SDL2_SHA256  third_party/sdl2.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz" --output third_party/sdl2.tar.gz
          fi
          echo "$SDL2_SHA256  third_party/sdl2.tar.gz" | sha256sum -c -
          tar -xzf third_party/sdl2.tar.gz -C third_party
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.restore-sdl.outputs.cache-hit != 'true'
        with:
          path: third_party/sdl2.tar.gz
          key: sdl2-mingw-${{ env.SDL2_VERSION }}-${{ env.SDL2_SHA256 }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-ccache
          key: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-
      - name: Choose build identity
        run: |
          echo "MIDAS_BUILD_TIME_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "MIDAS_RELEASE_TAG=build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Compile exact checked-out commit
        env:
          CCACHE_DIR: ${{ runner.temp }}/midas-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 256M
          CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          if [ "$CLEAN_BUILD" = true ]; then export CCACHE_DISABLE=1; fi
          ccache --zero-stats
          cmake -B build_win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Debug -DGE_VIDEO=ON -DGE_ROMDATA_FALLBACK=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_win --parallel "$(nproc)"
          ccache --show-stats | tee build_win/ccache-stats.txt
          cat build_win/ccache-stats.txt >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code HEAD
          python3 -c "import json; m=json.load(open('build_win/generated/build-info.json')); assert m['ci'] and not m['dirty']"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.clean_build != true
        with:
          path: ${{ runner.temp }}/midas-ccache
          key: ccache-v1-${{ steps.toolchain.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package only player files
        env:
          MIDAS_DEPENDENCIES_FILE: ${{ runner.temp }}/midas-deps/verified-inputs.json
          MIDAS_CLEAN_BUILD: ${{ inputs.clean_build == true }}
        run: |
          python3 scripts/port/package_windows.py --build build_win --output dist --sdl-license third_party/SDL2-${SDL2_VERSION}/LICENSE.txt
          python3 scripts/port/release_inputs.py --output dist/build-inputs.json
          cp build_win/ProjectMidas.exe dist/ProjectMidas.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-player-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-player-package
          path: dist
      - name: Attest exact executable and player ZIP
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/ProjectMidas.exe
            dist/Project-Midas-ADS-windows-x86.zip
      - name: Preserve provenance and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/build-provenance.sigstore.json
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('dist/build-info.json').read_text())
          assert m['commit']==os.environ['GITHUB_SHA'] and m['ci'] and not m['dirty']
          text=f'''Download **Project-Midas-ADS-windows-x86.zip**, extract the entire ZIP, put your own stock USA ROM in its Data folder, then run ProjectMidas.exe.

          This is a continuously published development build. Weapon icons are prepared locally on first launch; no Python or asset downloads are required.

          - Source: [{m['commit']}]({m['source_url']})
          - Built at: {m['built_at']}
          - GitHub Actions: [build run]({m['workflow_url']})
          - Signed provenance: [attestation]({os.environ['ATTESTATION_URL']})

          Verify with `gh attestation verify Project-Midas-ADS-windows-x86.zip -R {m['repository']}`. Build metadata, input fingerprints, checksums and the provenance bundle are preserved below. The ROM is not included.

          Preserve Data and midas.ini when updating. Suspend points require their original executable; campaign saves are separate.
          '''
          Path('notes.md').write_text(text)
          PY
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Windows build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA:0:9})" --notes-file notes.md dist/Project-Midas-ADS-windows-x86.zip dist/SHA256SUMS.txt dist/build-info.json dist/build-inputs.json dist/build-provenance.sigstore.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "## Windows download" >> "$GITHUB_STEP_SUMMARY"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
