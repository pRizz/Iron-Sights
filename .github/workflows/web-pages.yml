name: Browser build and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked launcher dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test ROM-free generation and launcher boundaries
        run: |
          python3 scripts/port/test_web_logo.py
          python3 scripts/port/test_web_spike.py
          python3 scripts/port/test_web_ccache.py
          bash scripts/port/test_web_menu_pointer.sh
          bash scripts/port/test_save_transfer.sh
          cd web
          bun tools/native-backup-audit.ts ../build/save-transfer-tests/driver
          bun run typecheck
          bun run test
      # The pinned ccache keeps compiled objects between runs, keyed on the SDK
      # pin; each run saves its own entry and restores the newest.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/web/ccache
          key: web-ccache-v1-${{ hashFiles('scripts/port/web_toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: web-ccache-v1-${{ hashFiles('scripts/port/web_toolchain.json') }}-
      - name: Build pinned SDK game and filesystem fixture without a ROM
        run: |
          python3 scripts/port/web_build.py video --jobs 4 --callback-types --ccache build/web/ccache
          python3 scripts/port/web_build.py files --jobs 4 --ccache build/web/ccache
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web/ccache
          key: web-ccache-v1-${{ hashFiles('scripts/port/web_toolchain.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check Wasm logo conversion
        run: |
          sdk_image=$(python3 -c 'import json; print(json.load(open("scripts/port/web_toolchain.json"))["image"])')
          docker run --rm --network=none --mount "type=bind,source=$PWD,target=/src,readonly" -w /src "$sdk_image" bash scripts/port/test_web_logo.sh --web
          docker run --rm --network=none --mount "type=bind,source=$PWD,target=/src,readonly" -w /src "$sdk_image" bash scripts/port/test_web_touch.sh
      - name: Assemble and verify the public artifact
        working-directory: web
        run: |
          bun run build
          bun run verify:site
          bunx playwright install --with-deps chromium
      - name: Test production project paths and browser storage
        working-directory: web
        run: |
          bun --bun vite preview --host 127.0.0.1 --port 4177 --base /Iron-Sights/ > ../build/web/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          bun tools/wait-for-site.ts http://127.0.0.1:4177/Iron-Sights/
          site=http://127.0.0.1:4177/Iron-Sights/
          # Three lanes side by side: the room and startup audits are the slow
          # ones; the rest share a lane (the two storage audits share an output
          # folder). Each lane stops at its first failure; every log is shown.
          lane() { local name=$1; shift; (set -e; for command in "$@"; do eval "$command"; done) > "../build/web/audit-$name.log" 2>&1; }
          lane room "bun run test:room $site" & room=$!
          lane startup "bun run test:startup $site" & startup=$!
          lane others "bun run test:launcher $site" "bun run test:touch" "bun run test:storage" \
            "bun run test:filesystem" "bun run test:sampler" & others=$!
          failed=0
          for name in room startup others; do
            if wait "${!name}"; then result=passed; else result=failed; failed=1; fi
            echo "::group::$name audits $result"; cat "../build/web/audit-$name.log"; echo "::endgroup::"
            if [ "$result" = failed ]; then echo "::error::The $name audits failed; see their log group"; fi
          done
          exit "$failed"
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/web-site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
